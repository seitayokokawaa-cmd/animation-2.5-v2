# examples/09-directed — the M10 exit film: `08-skit` re-cut with the
# cinematography kit. Iris-in open, framing presets (two-shot, close-up),
# snap zoom-punches on reactions, a whip-pan between speakers, a hard cut,
# a damped-spring track on the flung envoy, a wipe into a dusk-graded
# aftermath, and an iris-out verdict. Mock TTS keeps it offline.
#
#   pnpm mf voice sync examples/09-directed.mfs.yaml   # only if narration changed
#   pnpm mf render examples/09-directed.mfs.yaml -o out/09-directed.mp4
motionforge: 2
meta:
  title: The Negotiation, Directed
  resolution: 1280x720
  fps: 30
  seed: 90
  style: explainer-paper

voices:
  narrator: { engine: mock, voice: warm }
  king: { engine: mock, voice: gravel, pitch: -3, rate: 0.92 }
  envoy: { engine: mock, voice: bright, pitch: 7, rate: 1.1 }

use: [library/props.yaml]

cast:
  king:
    template: potato-biped
    size: 0.95
    palette: { outfit: '#8a1c1c', 'outfit-dark': '#5f1212', skin: '#f2cfa6' }
    costume: [royal-uniform, crown]
    mustache: imperial
    expression: angry
  envoy:
    template: potato-biped
    costume: [suit, plumed-hat]
    held: scroll

scenes:
  - id: parley
    stage: { preset: throne-room }
    music: { mood: jaunty, gain: 90 }
    transition: { kind: iris, duration: 0.9 }
    place:
      - { ref: king, as: king, at: [-2.4, -2.6] }
      - { ref: envoy, as: envoy, at: [2.2, -2.6], facing: left }
      - { ref: crate, as: crate, at: [5.2, -2.6], scale: 0.9 }
    narration:
      - voice: narrator
        text: >
          The negotiation began smoothly. The envoy presented a list of
          extremely reasonable demands.
        sync:
          - {
              on: 'negotiation began',
              do:
                { card: { style: chapter, text: THE NEGOTIATION, duration: 1.8, entrance: slam } },
            }
          - { on: 'negotiation began', do: { sfx: slam } }
          - { on: 'negotiation began', offset: 0.05, do: { camera: { shake: 0.35 } } }
          - { on: 'envoy presented', do: { enter: { target: envoy, from: right } } }
          - {
              on: 'envoy presented',
              offset: 0.1,
              do: { shot: { kind: two-shot, of: [king, envoy], duration: 0.6 } },
            }
          - { on: 'a list of', do: { sfx: quill } }
          - { on: 'reasonable demands', do: { gesture: { target: envoy, kind: point } } }
          - {
              on: 'reasonable demands',
              offset: 0.2,
              do: { react: { target: king, kind: eye-bulge, duration: 1.6 } },
            }
          - {
              on: 'reasonable demands',
              offset: 0.25,
              do: { camera: { zoom-punch: king, punch: 1.6, duration: 0.9 } },
            }
        pause: 0.5
      - voice: narrator
        text: The king took it about as well as expected.
        sync:
          - { on: 'The king', do: { shot: { kind: close-up, of: king, duration: 0.35 } } }
          - {
              on: 'about as well',
              do: { react: { target: king, kind: anger-steam, duration: 2.2 } },
            }
          - { on: 'as expected', do: { camera: { to: [0, -0.7], zoom: 1.15, whip: true } } }
          - { on: 'as expected', offset: 0.4, do: { gesture: { target: envoy, kind: shrug } } }
    lines:
      - { after: 'reasonable demands', speaker: envoy, say: Sign here please., react: hearts }
      - { after: 'as expected', speaker: king, say: Absolutely not. }

  - id: escalation
    stage: { preset: throne-room }
    music: { mood: tense }
    grade: dusk
    transition: { kind: crossfade, duration: 0.7 }
    place:
      - { ref: king, as: king, at: [-2.4, -2.6] }
      - { ref: envoy, as: envoy, at: [1.6, -2.6], facing: left }
      - { ref: crate, as: crate, at: [5.2, -2.6], scale: 0.9 }
    narration:
      - voice: narrator
        text: >
          Talks broke down almost immediately, along with the furniture.
          Diplomacy had failed, loudly.
        sync:
          - { on: 'Talks broke', do: { sfx: riser } }
          - { on: 'Talks broke', do: { shot: { kind: medium, of: envoy, cut: true } } }
          - { on: 'broke down', do: { bonk: { target: envoy } } }
          - { on: 'broke down', offset: 0.1, do: { camera: { shake: 0.4 } } }
          - {
              on: 'almost immediately',
              do: { fling: { target: envoy, to: [7.5, -2.6], height: 2.6, spins: 3, duration: 1 } },
            }
          - { on: 'almost immediately', do: { camera: { track: envoy, zoom: 1.25, duration: 1 } } }
          - { on: 'with the furniture', do: { explode: { target: crate } } }
          - {
              on: 'with the furniture',
              offset: 0.25,
              do: { camera: { cut: true, to: [0, -0.6], zoom: 1 } },
            }
          - { on: 'failed', offset: -0.4, do: { sfx: drumroll } }
          - { on: 'failed', do: { gesture: { target: king, kind: facepalm } } }
          - { on: 'failed', offset: 0.1, do: { camera: { zoom-punch: king, duration: 0.8 } } }
          - { on: 'loudly', do: { sfx: sting } }
          - {
              on: 'loudly',
              do:
                {
                  card:
                    {
                      style: label,
                      text: 'DIPLOMACY: FAILED',
                      at: [0, 1.6],
                      duration: 2.2,
                      size: 0.5,
                      entrance: slam,
                    },
                },
            }

  - id: verdict
    stage: { preset: throne-room }
    music: { mood: somber, gain: 80 }
    grade: night
    transition: { kind: iris, duration: 1 }
    duration: 3.2
    place:
      - { ref: king, as: king, at: [0, -2.6] }
    actions:
      - { at: 0.3, shot: { kind: medium, of: king, duration: 0.8 } }
      - { at: 0.5, posture: { target: king, kind: sit } }
      - {
          at: 1,
          card:
            {
              style: label,
              text: 'TALKS: CONCLUDED',
              at: [0, 3],
              duration: 2,
              size: 0.5,
              entrance: pop,
            },
        }
      - { at: 1.2, sfx: sting }
