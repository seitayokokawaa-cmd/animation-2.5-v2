          - { id: wb-hub, shape: { kind: circle, r: 0.09 }, fill: '#c8a24a' }
      - id: wheel-small
        at: [-0.55, 0.32]
        pivot: [0, 0]
        parts:
          - {
              id: ws-rim,
              shape: { kind: circle, r: 0.3 },
              fill: '#5d6773',
              stroke: { color: '#3e454e', width: 0.05 },
            }
          - {
              id: ws-spoke1,
              rotate: 45,
              shape: { kind: rect, width: 0.52, height: 0.06 },
              fill: '#3e454e',
            }
          - {
              id: ws-spoke2,
              rotate: 135,
              shape: { kind: rect, width: 0.52, height: 0.06 },
              fill: '#3e454e',
            }
          - { id: ws-hub, shape: { kind: circle, r: 0.07 }, fill: '#c8a24a' }

  bus:
    params: { body: '#b5453c' }
    parts:
      - {
          id: shadow,
          shape: { kind: ellipse, rx: 1.7, ry: 0.12 },
          at: [0, 0.02],
          fill: '#00000022',
        }
      - {
          id: body,
          at: [0, 1.05],
          shape: { kind: rect, width: 3.2, height: 1.5, rx: 0.22 },
          fill: '$body',
          stroke: { color: '#8e352e', width: 0.04 },
