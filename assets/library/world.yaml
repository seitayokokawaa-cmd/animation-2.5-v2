          fill: '#3e454e',
        }
      - id: wheel-big
        at: [0.75, 0.42]
        pivot: [0, 0]
        parts:
          - {
              id: wb-rim,
              shape: { kind: circle, r: 0.42 },
              fill: '#5d6773',
              stroke: { color: '#3e454e', width: 0.05 },
            }
          - { id: wb-spoke1, shape: { kind: rect, width: 0.74, height: 0.07 }, fill: '#3e454e' }
          - {
              id: wb-spoke2,
              rotate: 90,
              shape: { kind: rect, width: 0.74, height: 0.07 },
              fill: '#3e454e',
