        }
      - { id: puff, at: [-1.05, 2.05], shape: { kind: circle, r: 0.18 }, fill: '#cfcfcf' }
      - {
          id: cowcatcher,
          at: [-1.5, 0.42],
          shape: { kind: polygon, points: [[0.15, 0.3], [0.15, -0.3], [-0.35, -0.3]] },
          fill: '#5d6773',
        }
      - {
          id: frame,
          at: [0, 0.52],
