      - { id: knob-1, at: [0.55, 0.7], shape: { kind: circle, r: 0.035 }, fill: '#4a3a24' }
      - { id: knob-2, at: [0.55, 0.44], shape: { kind: circle, r: 0.035 }, fill: '#4a3a24' }
      - {
