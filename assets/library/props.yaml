# MotionForge built-in library — stage props (M5.5).
#
# Art direction: paper-cutout look. Every object is layered: dark under-tone
# → mid body → light top-face/highlight, plus a thin dark outline stroke on
# silhouette parts. Consistent palette across the library:
#   wood  #8a6a3f / dark #6e5330 / light #a8845a / outline #4a3a24
#   metal #7d8894 / dark #5d6773 / light #9aa5b1 / outline #3e454e
#   gold  #c8a24a / dark #a0803a / light #e0c37a
#   cloth #b5453c / dark #8e352e   paper #f3ead6 / shade #d9cdb2
# Convention: objects stand on y=0; `at:` places their feet. Sizes in world
# units (a person is ~1.8 tall). Moving parts carry pivots for hinge/spin.

objects:
  desk:
    params: { wood: '#8a6a3f' }
    parts:
      - {
          id: shadow,
          shape: { kind: ellipse, rx: 1.35, ry: 0.13 },
          at: [0, 0.02],
          fill: '#00000022',
        }
      - {
          id: leg-l,
          at: [-1.0, 0.42],
          shape: { kind: rect, width: 0.16, height: 0.84 },
          fill: '#6e5330',
        }
      - {
          id: leg-r,
          at: [1.0, 0.42],
          shape: { kind: rect, width: 0.16, height: 0.84 },
          fill: '#6e5330',
        }
      - {
          id: drawers,
          at: [0.55, 0.55],
          shape: { kind: rect, width: 0.9, height: 0.62, rx: 0.03 },
          fill: '$wood',
          stroke: { color: '#4a3a24', width: 0.025 },
        }
      - {
          id: drawer-top,
          at: [0.55, 0.7],
          shape: { kind: rect, width: 0.74, height: 0.2, rx: 0.02 },
          fill: '#a8845a',
        }
      - {
          id: drawer-bottom,
          at: [0.55, 0.44],
