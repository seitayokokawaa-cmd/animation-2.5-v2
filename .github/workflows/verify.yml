name: verify

on:
  push:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

      - name: Render example films
        run: |
          mkdir -p out
          pnpm mf render examples/01-shapes.mfs.yaml -o out/01-shapes.mp4
          pnpm mf render examples/03-narrated.mfs.yaml -o out/03-narrated.mp4

      - name: Upload rendered films
        uses: actions/upload-artifact@v4
        with:
          name: rendered-films
          path: out/**
          if-no-files-found: ignore
