name: verify

on:
  push:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

      # Example films render into out/ as milestones land (M2.8 onward); until
      # then this step finds nothing and is skipped.
      - name: Upload rendered films
        uses: actions/upload-artifact@v4
        with:
          name: rendered-films
          path: out/**
          if-no-files-found: ignore
